<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
  <title>Meals by Maggie</title>

    <!-- Link previews. On /recipe/* the edge function (terraform/app_account/lambda/preview)
         swaps this whole block for the recipe's own tags; keep the markers. -->
    <!-- og:start -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meals by Maggie" />
    <meta property="og:title" content="Meals by Maggie" />
    <meta property="og:description" content="Family recipes, saved and shared." />
    <meta property="og:image" content="https://mealsbymaggie.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="description" content="Family recipes, saved and shared." />
    <!-- og:end -->

    <!-- Theme colors for light/dark and PWA address bar coloring -->
    <meta name="theme-color" content="#fcf5f8" />

    <!-- iOS PWA support (ignored elsewhere) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meals" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Favicons for browser tabs -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
