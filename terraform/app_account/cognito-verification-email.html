<!-- Cognito verification email (sign-up and password-reset codes). Cognito swaps the code placeholder for the real code.
     Email clients ignore <style> blocks and web fonts, so everything is inline with safe fallbacks. -->
<div style="margin:0;padding:24px 12px;background-color:#fcf5f8;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;margin:0 auto;background-color:#ffffff;border:1px solid #eedde6;border-radius:18px;">
    <tr>
      <td style="padding:28px 28px 8px;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:28px;font-style:italic;font-weight:bold;color:#7b2453;">
        Meals by Maggie
      </td>
    </tr>
    <tr>
      <td style="padding:12px 28px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#3a2830;">
        <p style="margin:0 0 14px;">Hi there! &#128075;</p>
        <p style="margin:0 0 20px;">Here's your Meals by Maggie code. Enter it in the app or on the website to verify your email:</p>
      </td>
    </tr>
    <tr>
      <td style="padding:0 28px;">
        <!-- The code gets its own full-width block. letter-spacing is visual only, so copying gives the plain digits. -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f6e5ee;border:2px solid #7b2453;border-radius:16px;">
          <tr>
            <td align="center" style="padding:16px 12px 4px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;letter-spacing:2px;color:#7d6872;">YOUR CODE</td>
          </tr>
          <tr>
            <td align="center" style="padding:0 12px 18px;font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:42px;line-height:1.2;font-weight:bold;letter-spacing:10px;color:#7b2453;">{####}</td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 28px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;color:#7d6872;">
        <p style="margin:0 0 14px;">The code expires in 24 hours. If you didn't ask for it, you can safely ignore this email.</p>
        <p style="margin:0;color:#3a2830;">Happy cooking!<br>The Meals by Maggie Team</p>
      </td>
    </tr>
  </table>
</div>
